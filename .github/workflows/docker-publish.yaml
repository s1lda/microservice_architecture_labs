name: Build, Publish and Deploy Production Image

on:
  push:
    branches:
      - lab-1/microservice

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5 
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            TMUX_SESSION=deploy
            BRANCH_NAME=lab-1/microservice
            DEPLOY_PATH_VALUE=${{ secrets.DEPLOY_PATH }}
            
            if [ -d "$DEPLOY_PATH_VALUE" ]; then
              tmux send-keys -t $TMUX_SESSION "echo 'Updating existing repository...'" C-m
              tmux send-keys -t $TMUX_SESSION "cd $DEPLOY_PATH_VALUE" C-m
              tmux send-keys -t $TMUX_SESSION "git pull origin $BRANCH_NAME" C-m
            else
              tmux send-keys -t $TMUX_SESSION "echo 'Cloning new repository...'" C-m
              tmux send-keys -t $TMUX_SESSION "git clone --branch $BRANCH_NAME https://github.com/${{ env.IMAGE_NAME }}.git $DEPLOY_PATH_VALUE" C-m
              tmux send-keys -t $TMUX_SESSION "cd $DEPLOY_PATH_VALUE" C-m
            fi
            

            tmux send-keys -t $TMUX_SESSION "echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin" C-m
            tmux send-keys -t $TMUX_SESSION "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" C-m

            tmux send-keys -t $TMUX_SESSION "cat <<EOF > .env
            NODE_ENV=production
            PORT=${{ secrets.PORT_APP || 3000 }}
            DB_HOST=db
            DB_PORT=5432
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF" C-m

            tmux send-keys -t $TMUX_SESSION "docker-compose -f docker-compose.yaml up -d --build" C-m 