name: Build, Publish and Deploy Production Image

on:
  push:
    branches:
      - lab-1/microservice

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5 
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            TMUX_SESSION=deploy
            BRANCH_NAME=lab-1/microservice

            tmux send-keys -t $TMUX_SESSION "[ -d '${{ secrets.DEPLOY_PATH }}/.git' ] || git clone --branch $BRANCH_NAME https://github.com/${{ env.IMAGE_NAME }}.git '${{ secrets.DEPLOY_PATH }}'" C-m
            tmux send-keys -t $TMUX_SESSION "cd ${{ secrets.DEPLOY_PATH }}" C-m
            tmux send-keys -t $TMUX_SESSION "git checkout $BRANCH_NAME" C-m
            tmux send-keys -t $TMUX_SESSION "git pull origin $BRANCH_NAME" C-m
            

            tmux send-keys -t $TMUX_SESSION "echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin" C-m
            tmux send-keys -t $TMUX_SESSION "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" C-m
            tmux send-keys -t $TMUX_SESSION "docker-compose -f docker-compose.yaml up -d --build" C-m 