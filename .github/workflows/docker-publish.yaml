name: Build, Publish and Deploy Production Image

on:
  push:
    branches:
      - main
      - lab-1/microservice

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push: 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            BRANCH_NAME=${{ github.ref_name }}
            DEPLOY_PATH_VALUE=${{ secrets.DEPLOY_PATH }}

            if [ -d "$DEPLOY_PATH_VALUE" ]; then
              echo "✅ Directory exists. Updating repository in $DEPLOY_PATH_VALUE..."
              cd $DEPLOY_PATH_VALUE
              git checkout $BRANCH_NAME
              git pull origin $BRANCH_NAME
            else
              echo "🔎 Directory not found. Cloning new repository to $DEPLOY_PATH_VALUE..."
              git clone --branch $BRANCH_NAME https://github.com/${{ env.IMAGE_NAME }}.git $DEPLOY_PATH_VALUE
              cd $DEPLOY_PATH_VALUE
            fi

            echo "🔐 Logging in to Docker Registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            echo "📥 Pulling latest Docker image..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "📝 Creating .env file..."
            cat <<EOF > .env
            NODE_ENV=production
            PORT=${{ secrets.PORT_APP || 3000 }}
            DB_HOST=db
            DB_PORT=5432
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF
            echo ".env file created successfully."

            echo "🚀 Starting application with docker-compose..."
            docker-compose up -d --build
            echo "✅ Deployment successful!"