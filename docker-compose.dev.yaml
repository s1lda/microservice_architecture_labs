version: '3.8'

services:
  # PostgreSQL Database for development
  db:
    image: postgres:16-alpine
    container_name: blog-platform-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-blog_platform_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog-network-dev

volumes:
  postgres_data_dev:
    driver: local

networks:
  blog-network-dev:
    driver: bridge
