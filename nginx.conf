events {
    worker_connections 1024;
}

http {
    # Настройки логирования
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Настройки производительности
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream для основного backend сервиса (статьи и комментарии)
    upstream backend_service {
        server backend:3000;
        keepalive 32;
    }

    # Upstream для users-api сервиса (пользователи и аутентификация)
    upstream users_service {
        server users-api:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Размер буфера для запросов
        client_max_body_size 10M;

        # Заголовки для проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health check для API Gateway
        location /health {
            access_log off;
            return 200 '{"status":"OK","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # ============================================
        # USERS API - Маршрутизация на users-api сервис
        # ============================================
        
        # POST /api/users - регистрация
        location = /api/users {
            proxy_pass http://users_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # POST /api/users/login - аутентификация
        location = /api/users/login {
            proxy_pass http://users_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # POST /api/users/batch - получение пользователей по массиву ID
        location = /api/users/batch {
            proxy_pass http://users_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # GET /api/users/:id - получение пользователя по ID
        location ~ ^/api/users/(\d+)$ {
            proxy_pass http://users_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # GET/PUT /api/user - текущий пользователь
        location = /api/user {
            proxy_pass http://users_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Swagger документация users-api
        location /users-api-docs {
            rewrite ^/users-api-docs(.*)$ /api-docs$1 break;
            proxy_pass http://users_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ============================================
        # BACKEND - Маршрутизация на backend сервис
        # ============================================
        
        # Все остальные /api/* запросы идут в backend
        location /api {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Swagger документация backend
        location /api-docs {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Корневой маршрут - информация о Gateway
        location = / {
            return 200 '{
                "message": "Blog Platform API Gateway",
                "version": "2.0.0",
                "services": {
                    "users-api": {
                        "endpoints": ["/api/users", "/api/users/login", "/api/user", "/api/users/:id"],
                        "documentation": "/users-api-docs"
                    },
                    "backend": {
                        "endpoints": ["/api/articles", "/api/articles/:slug/comments"],
                        "documentation": "/api-docs"
                    }
                }
            }';
            add_header Content-Type application/json;
        }

        # Обработка ошибок
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 503 '{"error":"Service temporarily unavailable"}';
            add_header Content-Type application/json;
        }
    }
}
