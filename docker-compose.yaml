version: '3.9'

services:

  db-main:
    image: postgres:16-alpine
    container_name: blog-db-main
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_MAIN_USER:-app}
      POSTGRES_PASSWORD: ${DB_MAIN_PASSWORD:-app}
      POSTGRES_DB: ${DB_MAIN_NAME:-app_main}
    volumes:
      - db_main_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_MAIN_USER:-app} -d ${DB_MAIN_NAME:-app_main}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  db-users:
    image: postgres:16-alpine
    container_name: blog-db-users
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERS_USER:-app}
      POSTGRES_PASSWORD: ${DB_USERS_PASSWORD:-app}
      POSTGRES_DB: ${DB_USERS_NAME:-app_users}
    volumes:
      - db_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERS_USER:-app} -d ${DB_USERS_NAME:-app_users}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: db-main
      DB_PORT: 5432
      DB_USER: ${DB_MAIN_USER:-app}
      DB_PASSWORD: ${DB_MAIN_PASSWORD:-app}
      DB_NAME: ${DB_MAIN_NAME:-app_main}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    depends_on:
      db-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
  users-api:
    build:
      context: ./users_service
      dockerfile: Dockerfile
    container_name: blog-users-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: db-users
      DB_PORT: 5432
      DB_USER: ${DB_USERS_USER:-app}
      DB_PASSWORD: ${DB_USERS_PASSWORD:-app}
      DB_NAME: ${DB_USERS_NAME:-app_users}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    depends_on:
      db-users:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal

  api-gateway:
    image: nginx:alpine
    container_name: blog-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      users-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - internal

networks:
  internal:
    driver: bridge
    name: blog-platform-network

volumes:
  db_main_data:
    driver: local
  db_users_data:
    driver: local
